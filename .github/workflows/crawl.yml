# Daily crawl -> clean -> store -> retrain, then commit the updated database.
# Swap the practice site for a site adapter you have permission to crawl.
name: daily-crawl

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start practice site
        run: |
          python -m mock_site.server --port 8765 &
          sleep 2
      - name: Crawl, clean, store
        run: python pipeline.py crawl --site practice --delay 1
      - name: Retrain model
        run: python pipeline.py train
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/realestate.db models/
          git diff --cached --quiet || git commit -m "data: daily crawl $(date -u +%F)"
          git push
